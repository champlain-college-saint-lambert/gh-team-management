name: Self-Service Team Onboarding

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  validate-user:
    name: 1. Validate Username
    if: startsWith(github.event.issue.title, 'Onboard:')
    runs-on: ubuntu-latest
    outputs:
      github_handle: ${{ steps.extract-user.outputs.github_handle }}
    steps:
      - name: Extract Username from Issue Title
        id: extract-user
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_HANDLE="$(echo "${{ github.event.issue.title }}" | sed -E 's/^Onboard:[[:space:]]*//; s/[[:space:]]+$//')"

          if [ -z "$GITHUB_HANDLE" ]; then
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ The issue title must include a GitHub username after \`Onboard:\`."
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "not planned"
            exit 1
          fi

          echo "github_handle=$GITHUB_HANDLE" >> "$GITHUB_OUTPUT"

      - name: Check GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api users/${{ steps.extract-user.outputs.github_handle }} --silent; then
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ GitHub user \`${{ steps.extract-user.outputs.github_handle }}\` does not exist."
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "not planned"
            exit 1
          fi

  apply-and-commit:
    name: 2. Apply and Commit
    needs: validate-user
    runs-on: ubuntu-latest
    env:
      GITHUB_HANDLE: ${{ needs.validate-user.outputs.github_handle }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Existing Membership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e --arg user "$GITHUB_HANDLE" '.git_workshop | index($user) != null' terraform/members.json > /dev/null; then
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "ℹ️ GitHub user \`$GITHUB_HANDLE\` is already in the \`git_workshop\` team list."
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "completed"
            exit 1
          fi

      - name: Update Membership JSON
        run: |
          jq --arg user "$GITHUB_HANDLE" '.git_workshop += [$user]' terraform/members.json > temp.json
          mv temp.json terraform/members.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Terraform Init
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_github_token: ${{ secrets.ORG_PAT_TEAM_TOKEN }}
          TF_VAR_github_org: "champlain-college-saint-lambert"
        run: terraform apply -auto-approve

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/members.json
          git commit -m "Add $GITHUB_HANDLE to git_workshop team"
          git push

      - name: Comment and Close Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ Added \`$GITHUB_HANDLE\` to the \`git_workshop\` Terraform membership list and applied infrastructure changes."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "completed"