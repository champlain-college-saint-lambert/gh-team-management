name: Self-Service Team Onboarding

on:
  workflow_dispatch:
    inputs:
      github_handle:
        description: 'Your GitHub Username'
        required: true
        type: string

# Grant the default GITHUB_TOKEN write access to the repository
permissions:
  contents: write

jobs:
  validate-user:
    name: 1. Validate Username
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api users/${{ inputs.github_handle }} --silent; then
            echo "Error: User ${{ inputs.github_handle }} does not exist on GitHub."
            exit 1
          fi
          echo "User validated successfully."

  apply-and-commit:
    name: 2. Apply and Commit
    needs: validate-user
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Membership JSON Locally
        run: |
          # Updates the file on the runner, but does not commit it yet
          jq '.git_workshop += ["${{ inputs.github_handle }}"] | .git_workshop |= unique' terraform/members.json > temp.json
          mv temp.json terraform/members.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.0
      - name: Terraform Init
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_github_token: ${{ secrets.ORG_PAT_TEAM_TOKEN }}
          TF_VAR_github_org: "champlain-college-saint-lambert"
        run: terraform apply -auto-approve

      - name: Commit and Push Changes
        # This step only executes if the Terraform Apply was successful
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/members.json
          git commit -m "Add ${{ inputs.github_handle }} to git_workshop team" || echo "No changes to commit"
          git push