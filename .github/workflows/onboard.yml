name: Self-Service Team Onboarding

on:
  workflow_dispatch:
    inputs:
      github_handle:
        description: 'Your GitHub Username'
        required: true
        type: string

# Grant the default GITHUB_TOKEN write access to the repository
permissions:
  contents: write

jobs:
  validate-user:
    name: 1. Validate Username
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api users/${{ inputs.github_handle }} --silent; then
            echo "Error: User ${{ inputs.github_handle }} does not exist on GitHub."
            exit 1
          fi
          echo "User validated successfully."

  update-repository:
    name: 2. Update Membership File
    needs: validate-user
    runs-on: ubuntu-latest
    steps:
      # Default checkout uses GITHUB_TOKEN with write access
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Membership JSON
        run: |
          jq '.git_workshop += ["${{ inputs.github_handle }}"] | .git_workshop |= unique' members.json > temp.json
          mv temp.json members.json

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add members.json
          git commit -m "Add ${{ inputs.github_handle }} to git_workshop team" || echo "No changes to commit"
          git push

  terraform-apply:
    name: 3. Apply Terraform Cloud
    needs: update-repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_github_token: ${{ secrets.ORG_PAT_TEAM_TOKEN }}
          TF_VAR_github_org: "champlain-college-saint-lambert"
        run: terraform apply -auto-approve